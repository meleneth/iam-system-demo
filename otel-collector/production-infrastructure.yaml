    metrics: *postgresql_metrics
    endpoint: group-db:5432
    username: ${env:GROUP_DB_POSTGRES_USER}
    password: ${env:GROUP_DB_POSTGRES_PASSWORD}
    databases:
    - ${env:GROUP_DB_POSTGRES_DB}
  postgresql/group-db-cache:
    collection_interval: 10s
    tls: *postgresql_tls
    metrics: *postgresql_metrics
    endpoint: group-db-cache:5432
    username: ${env:GROUP_DB_CACHE_POSTGRES_USER}
    password: ${env:GROUP_DB_CACHE_POSTGRES_PASSWORD}
    databases:
    - ${env:GROUP_DB_CACHE_POSTGRES_DB}
  postgresql/group-db-cable:
    collection_interval: 10s
    tls: *postgresql_tls
    metrics: *postgresql_metrics
    endpoint: group-db-cable:5432
    username: ${env:GROUP_DB_CABLE_POSTGRES_USER}
    password: ${env:GROUP_DB_CABLE_POSTGRES_PASSWORD}
    databases:
    - ${env:GROUP_DB_CABLE_POSTGRES_DB}
  postgresql/group-db-queue:
    collection_interval: 10s
    tls: *postgresql_tls
    metrics: *postgresql_metrics
    endpoint: group-db-queue:5432
    username: ${env:GROUP_DB_QUEUE_POSTGRES_USER}
    password: ${env:GROUP_DB_QUEUE_POSTGRES_PASSWORD}
    databases:
    - ${env:GROUP_DB_QUEUE_POSTGRES_DB}
  redis/accountcache:
    endpoint: accountcache:6379
    collection_interval: 10s
    resource_attributes:
      server.address:
        enabled: true
      server.port:
        enabled: true
    metrics:
      redis.maxmemory:
        enabled: true
      redis.cmd.calls:
        enabled: true
      redis.cmd.usec:
        enabled: true
  redis/authcache:
    endpoint: authcache:6379
    collection_interval: 10s
    resource_attributes:
      server.address:
        enabled: true
      server.port:
        enabled: true
    metrics:
      redis.maxmemory:
        enabled: true
      redis.cmd.calls:
        enabled: true
      redis.cmd.usec:
        enabled: true
  redis/orgcache:
    endpoint: orgcache:6379
    collection_interval: 10s
    resource_attributes:
      server.address:
        enabled: true
      server.port:
        enabled: true
    metrics:
      redis.maxmemory:
        enabled: true
      redis.cmd.calls:
        enabled: true
      redis.cmd.usec:
        enabled: true
  redis/groupcache:
    endpoint: groupcache:6379
    collection_interval: 10s
    resource_attributes:
      server.address:
        enabled: true
      server.port:
        enabled: true
    metrics:
      redis.maxmemory:
        enabled: true
      redis.cmd.calls:
        enabled: true
      redis.cmd.usec:
        enabled: true
service:
  pipelines:
    metrics/infrastructure:
      receivers:
      - postgresql/account-db
      - postgresql/account-db-cache
      - postgresql/account-db-cable
      - postgresql/account-db-queue
      - postgresql/authz-db
      - postgresql/authz-db-cache
      - postgresql/authz-db-cable
      - postgresql/authz-db-queue
      - postgresql/organization-db
      - postgresql/organization-db-cache
      - postgresql/organization-db-cable
      - postgresql/organization-db-queue
      - postgresql/user-db
      - postgresql/user-db-cache
      - postgresql/user-db-cable
      - postgresql/user-db-queue
      - postgresql/group-db
      - postgresql/group-db-cache
      - postgresql/group-db-cable
      - postgresql/group-db-queue
      - redis/accountcache
      - redis/authcache
      - redis/orgcache
      - redis/groupcache
      processors: [memory_limiter, batch]
      exporters: [prometheus]
