# Production infrastructure receivers; merged with the shared collector config.
# Credentials come from production.env through the Compose wrapper.
receivers:
  postgresql/account-db:
    collection_interval: 10s
    tls: &postgresql_tls
      insecure: true
    metrics: &postgresql_metrics
      postgresql.blks_hit:
        enabled: true
      postgresql.blks_read:
        enabled: true
      postgresql.deadlocks:
        enabled: true
      postgresql.temp.io:
        enabled: true
    endpoint: account-db:5432
    username: ${env:ACCOUNT_DB_POSTGRES_USER}
    password: ${env:ACCOUNT_DB_POSTGRES_PASSWORD}
    databases:
    - ${env:ACCOUNT_DB_POSTGRES_DB}
  postgresql/account-db-cache:
    collection_interval: 10s
    tls: *postgresql_tls
    metrics: *postgresql_metrics
    endpoint: account-db-cache:5432
    username: ${env:ACCOUNT_DB_CACHE_POSTGRES_USER}
    password: ${env:ACCOUNT_DB_CACHE_POSTGRES_PASSWORD}
    databases:
    - ${env:ACCOUNT_DB_CACHE_POSTGRES_DB}
  postgresql/account-db-cable:
    collection_interval: 10s
    tls: *postgresql_tls
    metrics: *postgresql_metrics
    endpoint: account-db-cable:5432
    username: ${env:ACCOUNT_DB_CABLE_POSTGRES_USER}
    password: ${env:ACCOUNT_DB_CABLE_POSTGRES_PASSWORD}
    databases:
    - ${env:ACCOUNT_DB_CABLE_POSTGRES_DB}
  postgresql/account-db-queue:
    collection_interval: 10s
    tls: *postgresql_tls
    metrics: *postgresql_metrics
    endpoint: account-db-queue:5432
    username: ${env:ACCOUNT_DB_QUEUE_POSTGRES_USER}
    password: ${env:ACCOUNT_DB_QUEUE_POSTGRES_PASSWORD}
    databases:
    - ${env:ACCOUNT_DB_QUEUE_POSTGRES_DB}
