    endpoint: organization-db:5432
    username: ${env:ORGANIZATION_DB_POSTGRES_USER}
    password: ${env:ORGANIZATION_DB_POSTGRES_PASSWORD}
    databases:
    - ${env:ORGANIZATION_DB_POSTGRES_DB}
  postgresql/organization-db-cache:
