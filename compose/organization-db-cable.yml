---
services:
  organization-db-cable:
    image: postgres:18.6-trixie
    ports:
    - "${ORGANIZATION_DB_CABLE_POSTGRES_PORT}:5432"
    environment:
    - POSTGRES_DB=${ORGANIZATION_DB_CABLE_POSTGRES_DB}
    - POSTGRES_PASSWORD=${ORGANIZATION_DB_CABLE_POSTGRES_PASSWORD}
    - POSTGRES_USER=${ORGANIZATION_DB_CABLE_POSTGRES_USER}
    # PostgreSQL 18 uses a versioned PGDATA under this parent mount.
    # Keep older clusters intact; this subdirectory is a fresh PG18 cluster.
    volumes:
    - "${ORGANIZATION_DB_CABLE_POSTGRES_DATA}/pg18:/var/lib/postgresql"
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${ORGANIZATION_DB_CABLE_POSTGRES_USER} -d ${ORGANIZATION_DB_CABLE_POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
