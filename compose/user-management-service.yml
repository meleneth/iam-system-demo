---
services:
  user-management-service:
    image: parent_account_id/user-management-service
    ports:
      - "${USER_MANAGEMENT_WEB_PORT}:80"
    build:
      context: "."
      dockerfile: "user-management-service/Dockerfile"
    environment:
      USER_SERVICE_API_BASE_URL: http://user-service:80
      GROUP_SERVICE_API_BASE_URL: http://group-service:80
      ACCOUNT_SERVICE_API_BASE_URL: http://account-service:80
      ORGANIZATION_SERVICE_API_BASE_URL: http://organization-service:80
      SECRET_KEY_BASE: "${USER_MANAGEMENT_RAILS_SECRET_KEY_BASE}"
      AUTHORIZATION_SERVICE_API_BASE_URL: http://authorization-service:80
      AUTHORIZATION_CHECK_MODE: "${AUTHORIZATION_CHECK_MODE:-can}"
      IAM_DEMO_BATCH_SIZE: "${IAM_DEMO_BATCH_SIZE:-1000}"
      IAM_DEMO_RETRIEVAL_MODE: "${IAM_DEMO_RETRIEVAL_MODE:-batched}"
