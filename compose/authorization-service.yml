---
services:
  authorization-service:
    image: parent_account_id/authorization-service
    ports:
      - "${AUTHORIZATION_SERVICE_WEB_PORT}:3000"
    environment:
      - DATABASE_URL=${AUTHZ_DB_DATABASE_URL}
      - RAILS_ENV=test
      - RAILS_MAX_THREADS=5
      - RAILS_MIN_THREADS=5
      - ACCOUNT_SERVICE_API_BASE_URL=http://account-auth-service:80
      - GROUP_SERVICE_API_BASE_URL=http://group-auth-service:80
      - ORGANIZATION_SERVICE_API_BASE_URL=http://organization-auth-service:80
      - GLOBAL_IAM_DEMO_USE_REDIS=${GLOBAL_IAM_DEMO_USE_REDIS}
      - AUTHORIZATION_CHECK_MODE=${AUTHORIZATION_CHECK_MODE:-can}
      - IAM_DEMO_BATCH_SIZE=${IAM_DEMO_BATCH_SIZE:-1000}
      - IAM_INTERNAL_TOKEN=${IAM_INTERNAL_TOKEN}
      - SECRET_KEY_BASE=${AUTHORIZATION_RAILS_SECRET_KEY_BASE}
    build:
      context: "."
      dockerfile: "authorization-service/Dockerfile"
    depends_on:
      authz-db:
        condition: service_healthy
        restart: true
      group-auth-service:
        condition: service_started
      organization-auth-service:
        condition: service_started
