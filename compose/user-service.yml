---
services:
  user-service:
    image: parent_account_id/user-service
    ports:
      - "${USER_SERVICE_WEB_PORT}:3000"
    environment:
      - DATABASE_URL=${USER_DB_DATABASE_URL}
      - RAILS_ENV=test
      - RAILS_MAX_THREADS=5
      - RAILS_MIN_THREADS=5
      - SECRET_KEY_BASE=${USER_RAILS_SECRET_KEY_BASE}
      - AUTHORIZATION_CHECK_MODE=${AUTHORIZATION_CHECK_MODE:-can}
      - IAM_DEMO_BATCH_SIZE=${IAM_DEMO_BATCH_SIZE:-1000}
      - IAM_INTERNAL_TOKEN=${IAM_INTERNAL_TOKEN}
    build:
      context: "."
      dockerfile: "user-service/Dockerfile"
    depends_on:
      user-db:
        condition: service_healthy
        restart: true
