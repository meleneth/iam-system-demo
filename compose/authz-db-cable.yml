---
services:
  authz-db-cable:
    image: postgres:18.6-trixie
    ports:
    - "${AUTHZ_DB_CABLE_POSTGRES_PORT}:5432"
    environment:
    - POSTGRES_DB=${AUTHZ_DB_CABLE_POSTGRES_DB}
    - POSTGRES_PASSWORD=${AUTHZ_DB_CABLE_POSTGRES_PASSWORD}
    - POSTGRES_USER=${AUTHZ_DB_CABLE_POSTGRES_USER}
    # PostgreSQL 18 uses a versioned PGDATA under this parent mount.
    # Keep older clusters intact; this subdirectory is a fresh PG18 cluster.
    volumes:
    - "${AUTHZ_DB_CABLE_POSTGRES_DATA}/pg18:/var/lib/postgresql"
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${AUTHZ_DB_CABLE_POSTGRES_USER} -d ${AUTHZ_DB_CABLE_POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
